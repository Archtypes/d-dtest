name: Build HTML from Markdown

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Convert Markdown to HTML
        uses: jaywcjlove/markdown-to-html-cli@v5.0.3
        with:
          source: Main page.md
          output: Main page.html
